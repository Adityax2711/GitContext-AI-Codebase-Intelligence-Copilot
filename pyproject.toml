[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitcontext"
version = "0.1.0"
description = "AI-powered codebase intelligence copilot - Phase 1: Local Code & Doc Indexing and BM25 Search"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Aditya Raj" }
]
dependencies = [
    "rank-bm25>=0.2.2",
    "pydantic>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.1.0",
    "httpx>=0.27.0",
]
dense = [
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
]

[project.scripts]
gitcontext = "gitcontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
